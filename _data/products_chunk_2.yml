products:
- id: 31
  name: "JBL Tune 710BT Over Ear Bluetooth Headphones, New ,Sealed"
  category: "Headsets & Earbuds"
  description: >-
    > The JBL Tune 710BT Wireless Over-Ear Headphones are an ultra-long-battery
    budget option designed for high-end audio performance without structural
    complexity. Audio reviewers highlight their massive 50-hour playback endurance
    and heavy, thumping bass profile as standout points for daily plug-and-play
    music listening. Note that this specific model intentionally skips active noise
    cancellation (ANC) and smartphone app connectivity to provide a straightforward,
    simplified hardware experience. Hardware Specifications & Acoustics 40mm Dynamic
    Drivers: Engineered with signature JBL Pure Bass tuning to push crisp vocals
    alongside deep, high-impact sub-bass lines. 50-Hour Max Battery: Lasts through
    an entire week of heavy commuting on a single charge. Full recharging over
    Type-C takes 2 hours. 3-Hour Quick Charge: Dropping a dead headset onto a
    charging cord for just 5 minutes yields 3 full hours of instant wireless
    playback. Dual-Device Multipoint: Bluetooth 5.0 lets you simultaneously sync to
    two host platforms (e.g., your laptop and your smartphone). It automatically
    routes audio to whichever device triggers an incoming notification or media play
    button. Detachable 3.5mm Aux Line: Includes a 3.5mm backup cable in the retail
    box, letting you switch to zero-latency wired listening if the battery runs dry.
    Foldable Matte Chassis: Weighs only 220 grams and features internal folding
    hinges that let the earcups fold flat against the headband for dense bag
    storage. Functional Control Layout Unlike touch-based true wireless buds, the
    Tune 710BT houses tactile, physical click buttons on the right earcup rim for
    zero-look navigation: Dedicated Power/Pairing Toggle Volume Up / Track Forward
    Volume Down / Track Reverse Multi-Function Button: Manages call pickup, audio
    pausing, or a long-press to summon native phone smart assistants like Siri or
    Google Assistant.

- id: 32
  name: "JBL Tune 500 Wired On-Ear Headphones , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >+ The JBL Tune 500 Wired On-Ear Headphones are a battery-free, plug-and-play
    audio solution focused heavily on deep low-end output. Budget reviewers
    highlight their reliable, latency-free wired connection and lightweight frame,
    making them a highly practical choice for straightforward classroom lessons,
    office voice calls, and legacy devices with a headphone jack. Core Technical
    Specifications & Design 32mm Dynamic Drivers: Imbued with signature JBL Pure
    Bass tuning to prioritize thick, punchy bass lines and rich lower-frequency
    tracks. Lag-Free 3.5mm Jack: Uses a fixed, permanently attached 46-inch audio
    cable. It draws power entirely from the source device, requiring zero recharging
    or batteries. Tangle-Free Flat Cable: The audio cord is designed with a
    specialized flat ribbon profile to prevent knots and tangles during storage.
    1-Button In-Line Remote: A single mechanical click-button built into the wire
    handles call management, media playback pausing, track skipping, and smartphone
    assistant activation. Foldable On-Ear Chassis: Weighs just 148 grams. The
    earcups swivel and fold inward toward the padded headband to easily slip into a
    backpack. Transitioning from the Tune 710BT to the Tune 500 If you are
    considering these alongside the over-ear JBL Tune 710BT you just looked at, the
    hardware changes are distinct: Form Factor Difference: The Tune 710BT is an
    over-ear headset that surrounds the outer ear for better isolation. The Tune 500
    is a smaller on-ear design that rests directly on the ear cartilage.
    Connectivity Limits: The Tune 710BT lets you roam cord-free via Bluetooth. The
    Tune 500 requires a physical connection, meaning modern smartphones will require
    a USB-C or Lightning to 3.5mm dongle adapter. On-Board Controls: While the 710BT
    has a full set of volume adjustments on the earcup rim, the Tune 500 relies
    completely on its single-button wire or your host device to scale volume up or
    down.

- id: 33
  name: "JBL Tune 520BT Bluetooth Wireless On-Ear Headphones , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The JBL Tune 520BT Wireless On-Ear Headphones are a major wireless upgrade to
    the entry-level series, delivering a massive 57-hour battery life and official
    app customization at a budget price point. Online audio reviewers praise them as
    an incredibly long-lasting daily commuter option that packs deep, punchy low-end
    performance. Core Technical Upgrades & Features Up to 57 Hours of Power:
    Features a highly efficient battery offering up to 57 hours of straight
    playback. Full recharging takes exactly 2 hours over a Type-C cable.
    Lightning-Fast Speed Charge: Connecting the headset to a power cable for just 5
    minutes provides 3 full hours of instant wireless playback. Modern Bluetooth
    5.3: Upgraded wireless protocols ensure lower power draw, faster pairing, and
    extended line-of-sight range. Dual-Device Multipoint Connection: Seamlessly
    pairs with two source devices at once. It automatically shifts audio from a
    movie on your laptop to an incoming call on your phone. JBL Headphones App
    Support: Grants access to a full smartphone software suite. This lets you build
    custom EQ profiles, alter automated power-off intervals, and update firmware.
    Hands-Free Voice Aware: The integrated microphone setup lets you balance exactly
    how much of your own voice you can hear echoing back through the drivers during
    a live phone call. 33mm Dynamic Drivers: Imbued with signature JBL Pure Bass
    sound parameters to maximize lower-frequency tracking and high output volumes.
    Upgrading from the Wired Tune 500 If you are moving up from the wired JBL Tune
    500 headset you checked out previously, the 520BT model introduces drastic daily
    enhancements: Wireless Freedom: Replaces the permanent 46-inch audio ribbon wire
    entirely with cord-free Bluetooth tracking. Note that the 520BT is strictly a
    wireless headset and does not feature a backup 3.5mm jack. Custom Sound Tuning:
    The Tune 500 relies on static, hard-coded factory settings. The Tune 520BT links
    to a full graphical EQ application to fine-tune audio bands to your exact
    preferences. Physical Architecture: While the physical on-ear size profile and
    folding hinge layout are near identical, the 520BT moves all media adjustments
    from an in-line wire button up to tactile on-ear earcup switches

- id: 34
  name: "JBL Tune 670NC Wireless On-Ear Headphones , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The JBL Tune 670NC Wireless On-Ear Headphones represent a premium functional
    jump in the series, adding Adaptive Active Noise Cancellation (ANC) and an
    industry-leading 70-hour maximum battery run time. Tech reviewers note that they
    combine the lightweight portability of the smaller on-ear Tune 520BT with the
    advanced noise-filtering tech of the over-ear models. Core Technical Upgrades &
    Hardware Adaptive Noise Cancellation (ANC): The internal acoustic microphone
    array constantly measures surrounding environments to systematically isolate
    subways, office chatter, and street noise. Ambient Aware & TalkThru: Lets you
    instantly loop outside environment noise back through the speaker drivers for
    sidewalk walking safety, or drops media volume down to let you hold a
    conversation without removing the headset. 70-Hour Max Battery: Delivers an
    astonishing 70 hours of consecutive wireless runtime with ANC deactivated.
    Enabling Adaptive ANC still leaves you with a highly impressive 44 hours of
    playtime on a single charge. Lightning-Fast Speed Charging: Hooking the low
    battery chassis to a Type-C cable for just 5 minutes yields 3 full hours of
    instant wireless audio playback. Bluetooth 5.3 & LE Audio: Utilizes the latest
    energy-efficient wireless protocol for lower latency, faster syncing, and
    seamless Multi-Device Multipoint shifting between your laptop and smartphone.
    JBL Headphones App Synergy: Pairs natively with the official software suite to
    manually balance the graphical EQ bands, tweak automated standby timers, or
    toggle between prioritized \"Audio\" and \"Video\" low-latency modes. Upgrading
    from the Tune 520BT If you are evaluating these against the step-down JBL Tune
    520BT headphones you checked out earlier, the Tune 670NC provides distinct
    advantages: Active Isolation: The Tune 520BT uses physical clamping pressure
    alone to muffle noise. The Tune 670NC uses motorized microphones to digitally
    cancel outside distractions. Wired Fallback Option: While the Tune 520BT is
    strictly wireless, the Tune 670NC features a detachable auxiliary cable port so
    you can switch to an unpowered wired connection if your battery runs out. Voice
    Tracking: Uses advanced VoiceAware integration so you can select exactly how
    much of your own voice echoes back through the speakers during professional cell
    phone calls.

- id: 35
  name: "Motorola XT220 Over-Ear Headphones , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
