- id: 358
  name: "Amazfit T-Rex 3 Military Smart Watch  , 48MM  , New , Sealed"
  category: "Smart Watches"
  description: >-
    >- The Amazfit T-Rex 3 Military Smart Watch is a rugged and capable outdoor
    smartwatch designed for adventurers, athletes, and anyone who wants a tough
    wearable that can keep up with an active lifestyle. Built with military-grade
    durability, this watch can withstand extreme conditions and rough use, making it
    a strong choice for hiking, trail running, camping, and everyday wear. The
    robust 48 mm case and reinforced build not only protect the internals but also
    give the watch a bold, striking presence on the wrist. Equipped with built-in
    GPS, the T-Rex 3 offers accurate location tracking for outdoor workouts and
    navigation, while offline maps help you stay oriented even when your phone isn’t
    nearby. The integration of AI and voice control adds a modern convenience layer,
    letting you interact with the watch hands-free for tasks like starting workouts,
    checking stats, or setting reminders. This smartwatch supports both Android and
    iPhone devices, making it a versatile companion regardless of your smartphone
    choice. Fitness and health tracking are core strengths of the T-Rex 3, with
    support for 170 sports modes that cover a wide range of activities from running
    and cycling to swimming and strength training. Comprehensive health metrics keep
    tabs on heart rate, sleep, stress levels, and more, while advanced training
    insights help you monitor performance and recovery. Whether you’re a seasoned
    athlete or just aiming to stay active, the watch provides data that’s easy to
    review and use. Durability is taken seriously with this model — it’s
    water-resistant to 328 feet (100 meters), so it can handle swimming, rainy runs,
    and wet environments without blinking. The overall feature set balances outdoor
    ruggedness, smart functionality, and health-focused tracking, making the Amazfit
    T-Rex 3 a solid all-around choice for users who want both resilience and
    connected fitness in one device

- id: 359
  name: "WITHit Deca Smartwatch  , New ,  Sealed"
  category: "Smart Watches"
  description: >-
    > The WITHit Deca Smartwatch is a modern wearable designed to blend
    functionality with style. It features a 1.43-inch AMOLED high-definition
    touchscreen display with a resolution of 466 x 466 pixels, delivering sharp
    visuals and vibrant colors. The watch is housed in a 45mm base metal case and
    comes with a smooth silicone black band equipped with quick-release technology
    for easy customization. In terms of health and fitness tracking, the Deca
    Smartwatch offers features such as heart rate monitoring, blood oxygen (SpO₂)
    tracking, sleep analysis, and stress level monitoring. It also includes a
    variety of sports modes to cater to different activities. The watch is
    water-resistant up to 1.5 meters for 30 minutes, making it suitable for everyday
    wear and light water exposure. To enhance user experience, the Deca Smartwatch
    is compatible with the WITHit Smartwatch App, which is available for both
    Android and iOS devices. This app allows users to sync their devices, manage
    health data, customize watch faces, and access various functionalities. The
    watch supports Bluetooth and Wi-Fi connectivity, enabling seamless integration
    with your smartphone. For power, the Deca Smartwatch includes a magnetic rapid
    charger, ensuring convenient and efficient charging. The watch boasts a battery
    life of up to 120 hours, depending on usage, and offers a standby time of up to
    60 days. Overall, the WITHit Deca Smartwatch combines advanced technology with a
    sleek design, making it a versatile choice for individuals seeking a reliable
    and stylish smartwatch. Specifications Model Name: WITHit Deca Smartwatch Model
    Number: 42-9000BKBKW

- id: 360
  name: "WITHit Giga Smartwatch  Amoled 2.04 , New ,  Sealed"
  category: "Smart Watches"
  description: >-
    > The WITHit Giga Smartwatch presents a large, vibrant 2.04-inch high-definition
    AMOLED touchscreen—with a resolution of 386 × 448 pixels—that fills its face and
    offers easily readable visuals and customizable watch faces. The case is
    aluminum (or ABS/aluminum blend depending on source) and the handset comes with
    a quick-release silicone band for comfort and interchangeability. Designed for
    modern wearers who want connected features and style on a budget, the Giga
    supports both Android 5.0+ and iOS 9.0+ through the WITHit Smartwatch App,
    enabling smartphone notifications, Bluetooth calling, music controls, and watch
    face customization. In terms of health and activity tracking, this smartwatch
    offers step counting, heart-rate monitoring, blood oxygen (SpO₂) tracking, sleep
    tracking, and women’s health/menstrual cycle tracking. It also supports general
    smartwatch features such as incoming call handling, notification alerts for apps
    like WhatsApp and Snapchat, remote camera control, and music control via the
    connected phone. Battery life claims run up to approximately 120 hours in light
    use. On the durability side, it is rated for water resistance up to 1.5 meters
    for 30 minutes—enough for light water exposure—but it is not built for heavy
    submersion or diving. While the Giga delivers impressive value, reviewers note
    some trade-offs: it uses a proprietary charging cable, the screen lacks adaptive
    brightness (making outdoor visibility and night use less optimal), and some
    users report inconsistent metrics in activity tracking. Model Name: WITHit Giga
    Smartwatch Model Number: 42-9002GYBKW Display Screen Type: AMOLED
    high-definition touchscreen Screen Size: 2.04 inches

