    details. It's designed to be battery powered, providing flexibility in placement
    without the need for complicated wiring or constant power. Built with
    AI-enhanced motion detection and a PIR (Passive Infrared) sensor, the camera
    intelligently distinguishes between people and other movement, minimizing false
    alarms from animals or passing cars. When motion is detected, a built-in
    spotlight can automatically activate, helping to deter unwanted visitors and
    improve visibility during nighttime events. The camera also includes two-way
    audio, allowing you to hear what's happening and speak directly through the
    camera using your smartphone. Weather-resistant and designed for outdoor use,
