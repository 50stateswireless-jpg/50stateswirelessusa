- id: 526
  name: "Sony WF-1000XM5 , True Wireless Earbud , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Sony WF-1000XM5 , released in July 2023, represents Sony's flagship true
    wireless earbud entry, widely praised by audiophiles for its class-leading
    active noise cancellation (ANC) and extensive sound customization. Designed with
    a smaller, more ergonomic gloss-and-matte chassis than its bulky predecessor
    (the XM4), it remains a top-tier competitor in the premium audio market. Key
    Features & Specifications Acoustics & Processing: Equipped with specially
    designed 8.4 mm Dynamic Driver X units and dual proprietary processors (the
    Integrated Processor V2 and HD Noise Cancelling Processor QN2e) to produce rich
    vocals, deep bass, and high-resolution spatial audio. Industry-Leading ANC:
    Combines a six-microphone array with unique polyurethane Noise Isolation Foam
    Tips that mechanically seal out mid- and high-frequency ambient sounds. Advanced
    Voice Pickup: Incorporates an AI-driven noise reduction algorithm alongside
    physical bone conduction sensors that detect structural vibrations from your
    skull to keep voice calls crystal clear in loud environments. Battery &
    Charging: Offers up to 8 hours of continuous playback with ANC turned on
    (extending to 24 hours total via the charging case). A quick 3-minute charge via
    USB-C or Qi wireless pads provides up to 1 hour of listening time. Smart
    Features: Includes Bluetooth 5.3 with Multipoint connectivity (seamless
    dual-device pairing), Speak-to-Chat (pauses audio automatically when you speak),
    and an IPX4 water-resistance rating.

- id: 527
  name: "Bose Quitecomfort  Wireless  Earbuds II  , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Bose QuietComfort Earbuds II are premium true wireless earbuds celebrated
    for delivering some of the world's best active noise cancellation (ANC).
    Launched at an original retail price of $279.99, they feature a smaller, more
    streamlined design than their predecessors and utilize custom sound calibration.
    Industry-Leading Noise Cancellation & Audio CustomTune Technology: Every time
    you put the earbuds in, they play a chime to map the unique shape of your ear
    canal, instantly optimizing both the audio frequency and the ANC performance.
    Aware Mode with ActiveSense: Pipes in ambient sound so you can hear your
    surroundings, while automatically dampening sudden loud background noises (like
    a passing siren or construction) to a comfortable level. Bose Signature Sound:
    Delivers deep bass and balanced high-fidelity audio, which can be further
    adjusted using the custom EQ presets within the [Bose Music App](1.1.8, 1.4.3).
    Hardware, Fit, & Battery Bose Fit Kit: Replaces traditional one-piece ear tips
    with a two-piece system, combining three sizes of umbrella-shaped silicone tips
    with three separate stability bands to ensure a secure, customized seal. Battery
    Life: Provides up to 6 hours of continuous runtime with ANC turned on, plus an
    additional 18 hours (three full charges) from the case. A quick 20-minute charge
    yields up to 2 hours of playback.

- id: 528
  name: "Google Pixel Buds Pro (2022)  New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Google Pixel Buds Pro (1st Generation) , released in July 2022, are
    Google's debut flagship true wireless earbuds to feature Active Noise
    Cancellation (ANC). Originally launching at an MSRP of $199.99, they serve as an
    ecosystem-focused, high-utility audio solution heavily tailored for Android and
    Google Pixel users. Acoustic Architecture & Adaptive ANC Custom 11mm Drivers:
    Equipped with large dynamic speaker drivers paired with an automated Volume EQ
    system that dynamically adjusts frequency responses to preserve rich bass and
    treble balance at lower volumes. Silent Seal Noise Cancellation: Employs an
    intelligent ANC algorithm that continuously measures in-ear canal pressure to
    adapt the acoustic seal, dampening ambient environmental frequencies. Integrated
    Transparency Mode: Pumps in external sounds via built-in beamforming microphones
    so you can maintain quick, real-time situational awareness. Smart Functionality
    & Software Drops Bluetooth Multipoint & Fast Pair: Supports dual-device
    connectivity. The earbuds effortlessly hot-swap audio paths between a laptop
    movie and a cellular phone call. Hands-free Voice Actions: Always-on capacitive
    listening allows you to invoke Google Assistant instantly with standard wake
    phrases to check notifications or dictate texts. Post-Launch Performance Drops:
    Periodic software upgrades added advanced features like Spatial Audio with Head
    Tracking, hearing wellness exposure metric tracking, and conversation detection
    that pauses playback as soon as you start speaking. Battery, Power, & Build
    Uncompressed Playback Endurance: Delivers up to 7 hours of continuous operation
    with ANC fully active, or up to 11 hours with ANC deactivated. Sliding Charging
    Vault: The pebble-style charging case extends total operational boundaries to 31
    hours and natively accepts USB-C wires alongside standard Qi wireless pads.
    Robust Water Resistance: The individual earbuds carry an IPX4 splash-proof
    rating to safely block sweat or sudden rain, while the storage case holds a
    distinct IPX2 defense layer.

