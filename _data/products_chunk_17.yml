- id: 524
  name: "Apple AirPods Pro (3nd Gen) 2025 , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Apple AirPods Pro 3 (3rd Gen) represents Apple's premier flagship in-ear
    audio experience, officially launched on September 9, 2025. Built on an
    overhauled internal and external geometric footprint, this generation packs
    advanced biometric tracking alongside breakthrough computational audio. Key
    Specifications & Groundbreaking Upgrades Health Tracking Integration: Features a
    built-in heart rate sensor that measures pulse and tracks metrics across 50
    different workout types directly through the iPhone Fitness app. World-Class
    Noise Management: The redesigned multiport acoustic architecture removes up to
    twice as much background noise as the AirPods Pro 2, working with the Apple H2
    chip to adjust soundscapes seamlessly. Live Translation Capabilities: Leverages
    integrated Apple Intelligence algorithms to provide real-time audio translation
    directly into your ears during face-to-face cross-language conversations. Rugged
    Durability Overhaul: Upgrades from the older splash-proof designs to a fully
    certified IP57 dust and water resistance rating across both the individual
    earbuds and the charging case. Expanded Custom Fit: The redesigned charging case
    comes packed with five complete sizes of silicone ear tips, introducing an
    all-new XXS tip sizing profile to comfortably secure tighter ear shapes. Battery
    & Power Breakdown Solo Playback: Delivers up to 8 hours of listening time on a
    single charge with Active Noise Cancellation (ANC) active. Biometric Run Time:
    Engaging the active heart rate sensor during exercises scales performance back
    to roughly 6.5 hours of playback. The Case Reservoir: Combined with the
    companion MagSafe Charging Case (USB-C), you unlock 24 hours of total listening
    time. A quick 5-minute dock in the case replenishes approximately 1 hour of
    power.

- id: 525
  name: "Apple AirPods (2nd Gen)  With Wireless Charging Case ,2019 , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Apple AirPods Pro (1st Gen) , released on October 30, 2019, marked
