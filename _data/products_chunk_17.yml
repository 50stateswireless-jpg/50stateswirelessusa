- id: 531
  name: "Samsung Galaxy Buds Core  , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >+ The Samsung Galaxy Buds Core (SM-R410) are Samsung's ultra-budget entry in
    their true wireless lineup, focusing on flagship-style smart features at an
    accessible entry price, they provide a highly competitive option that sits below
    the Galaxy Buds FE. Audio Design & Codecs Single Dynamic Driver: Houses a single
    custom dynamic driver tuned primarily for deep bass and clear, prominent vocal
    frequencies. Acoustic Profile: Delivers a consumer-friendly, bass-forward sound
    signature that handles everyday streaming smoothly. Samsung Scalable Codec
    (SSC): Utilizes Samsung's proprietary high-efficiency audio codec alongside
    baseline AAC and SBC profiles. SSC automatically adjusts streaming bitrates to
    prevent dropouts on paired Galaxy devices. Noise Management & Microphones
    Adaptive Active Noise Cancellation: Employs effective ANC filters to cut
    low-frequency environmental rumble like engine noise or city office hums.
    Ambient Transparency Mode: Pipes outside environmental audio through the earbud
    array so you can retain quick situational awareness. Six-Microphone System: Uses
    three integrated mics per earbud to balance voice isolation, background
    environmental noise reduction, and ongoing ANC processing. Ecosystem Integration
    & AI Galaxy AI Compatibility: Leverages native device processing to stream
    face-to-face translations using Galaxy AI Interpreter Mode directly to your
    ears. Smart Cross-Device Switch: Uses the Samsung cloud matrix to hot-swap audio
    feeds between your Galaxy smartphone, tablet, or Galaxy Watch automatically
    depending on active feeds. Samsung Find Mesh: Coordinates with the global
    tracking network, enabling your buds to ring aloud for easy tracking if
    misplaced. Hardware, Shell, & Battery Secure Wingtip Ergonomics: Swaps the stem
    look for a streamlined, rounded pill design complete with stabilization wings
    for pressure-free workout tracking. IP54 Rugged Shielding: Provides a certified
    protective barrier against fine dust and incoming splashes from all directions.
    35-Hour Total Playtime: The buds run between 6 to 8 hours continuously per
    charge with ANC active. The compact clamshell case pushes total playback limits
    to 35 hours when ANC is turned off.

- id: 532
  name: "Samsung Galaxy Buds FE  , New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Samsung Galaxy Buds FE (Fan Edition) are Samsung's mid-tier,
