- id: 522
  name: "Apple Airpods (3rd Gen) With Lightning Charging Case , 2021, New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Apple AirPods (3rd Gen) with Lightning Charging Case (2021) represents
    the wired-only configuration of Apple's redesigned third-generation open-ear
    earbuds. This specific model completely swaps out wireless charging
    compatibility to offer a more budget-friendly price point while retaining the
    identical acoustic hardware and performance of the standard 3rd Gen lineup. Key
    Performance Specs & Features Wired-Only Charging Case: The bundled charging case
    (Model A2897) can only be charged using a physical Lightning cable connected to
    a USB-C or USB-A wall brick. It lacks internal magnetic induction coils, meaning
    it will not react if placed on a MagSafe magnet, a standard Qi wireless pad, or
    an Apple Watch puck. Personalized Spatial Audio: Uses advanced gyroscopes and
    accelerometers to deliver multi-dimensional 3D audio with dynamic head tracking,
    positioning theater-like sound fields all around you when streaming compatible
    Dolby Atmos media. Apple H1 Processor: Driven by the custom H1 chip, providing
    instantaneous proximity pairing, automatic shifting between your iCloud-linked
    devices, and hands-free \"Hey Siri\" tracking. Contoured Open Fit: Designed with
    an ergonomically mapped contour that sits snugly at an optimal acoustic angle
    without using deep, rubberized silicone ear tips. The stems feature physical
    pressure-sensitive force sensors to let you effortlessly squeeze to control
    playback or phone calls. IPX4 Ruggedness: Both the earbuds and the Lightning
    case are certified IPX4 sweat and water-resistant, making them safe against rain
    or heavy workouts. Battery Performance Earbud Playback: Delivers up to 6 hours
    of continuous listening or up to 4 hours of continuous talk time on a single
    full charge. Total Runtime Reservoir: Tucking the earbuds back into the case
    expands total mobile operational life to 30 hours before you need to plug in a
    Lightning cable. Fast Fuel: A rapid 5-minute dock inside the charging case
    yields 1 hour of continuous music playback when your batteries drop to zero.

- id: 523
  name: "Apple Airpods (3rd Gen) With MagSafe Charging Case , 2021, New , Sealed"
  category: "Headsets & Earbuds"
  description: >-
    >- The Apple AirPods (3rd Gen) with MagSafe Charging Case (2021) represents the
    fully wireless-compatible version of Apple's third-generation open-ear earbuds.
