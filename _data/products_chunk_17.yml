    mapped contour that sits snugly at an optimal acoustic angle without using deep,
    rubberized silicone ear tips [1, 2]. The shorter stems feature physical
    pressure-sensitive force sensors to let you squeeze to control playback or phone
    calls [1, 2]. IPX4 Ruggedness: Both the earbuds and the MagSafe case are
