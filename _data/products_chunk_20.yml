- id: 602
  name: "Wireless Charging Sterilizing Box  , New , Sealed"
  category: "Charger"
  description: >-
    A wireless charging sterilizing box is an all-in-one desktop accessory that uses
    germicidal UV-C light to destroy up to 99.9% of bacteria and viruses on
    high-touch objects while wirelessly charging Qi-compatible devices. It provides
    a chemical-free, heat-free method to safely sanitize phones, wireless earbuds,
    keys, watches, and face masks. Key Features & Buying TipsCharging Placement:
    Take note of where the phone sits. Models like the Samsung ITFIT charge your
    phone inside the chamber while it sanitizes, whereas other models feature the
    wireless charging coil on top of the exterior lid so you can easily view your
    screen.Aromatherapy Compartments: Many generic and branded boxes include a
    built-in aromatherapy port. Dropping a small amount of essential oil into the
    designated internal slot freshens up the scent of your phone while it undergoes
    disinfection.Auto-Shutoff Safety: Standard models are engineered with safety
    switches that automatically shut off the UV-C lamps the moment the lid is
    opened, preventing potential skin or eye exposure to ultraviolet rays.

