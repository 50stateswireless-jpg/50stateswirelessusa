    Storage: The folding folio flap features 4 dedicated card slots, a clear
    thumb-glide ID window, and a full-length interior pocket for cash, receipts, or
    notes. All-Around Drop Defense: A polycarbonate inner shell paired with a raised
    TPU screen bezel provides military-grade drop defense, while the front fold
    shields your glass screen from keys and debris. Tailored Ergonomics: Precision
    cutouts offer unhindered access to the iPhone 17 speaker ports, charging slot,
    and the tactile side control buttons.

