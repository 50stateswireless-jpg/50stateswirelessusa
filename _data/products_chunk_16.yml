    essential network access with a lower price point by excluding premium add-ons.
    Primary Plan Features Unlimited Data: Access to 5G network speeds, though
    Cricket may temporarily slow down data speeds during heavy cellular network
    congestion. Video Quality: Video streaming is restricted to Standard Definition
    (SD) at roughly 480p. North American Calling: Includes unlimited voice calls and
    text messages originating from the U.S. to destinations in Mexico and Canada.
    Key Restrictions & Exclusions Availability Restriction: This plan is explicitly
    reserved for new lines of service only (via a new number or port-in) and is
    unavailable to existing customers trying to switch tiers. No Built-In Hotspot:
    Mobile hotspot capabilities are omitted, though a 10GB hotspot add-on can be
    manually attached for an extra $10 per month. No International Roaming: Cellular
    data usage and roaming inside Mexico or Canada are completely blocked. No Global
    Texting: International texting to countries outside of North America is
    unavailable. No Entertainment Add-ons: Max (HBO Max with Ads) and cloud storage
    tiers are entirely excluded.

