- id: 498
  name: "Cricket Wireless Sensible 10GB Plan"
  category: "Phone Plans"
  description: >-
    >+ (Phone not Included) The Cricket Wireless Sensible™ 10GB Plan costs $30 per
    month with Auto Pay ($35 for your first month or if you pay manually). It
    provides exactly 10GB of high-speed data on AT&T’s nationwide network. Key Plan
    Details Data Refresh: You get 10GB of high-speed data per month. If you exceed
    this cap, speeds are throttled to a slow 128 Kbps for the rest of your billing
    cycle. Network & Quality: Runs on AT&T's 5G network. Video streaming is capped
    at Standard Definition (480p). Line Consistency: If you have multiple lines, all
    lines must be on the Sensible™ 10GB Plan tier; you cannot mix and match it with
    unlimited family plans. Dropped Features & Restrictions No Hotspot: Mobile
    hotspot capabilities are completely unavailable, and you cannot buy it as an
    add-on for this plan. No International Use: This plan strips away Cricket's
    usual international perks. It includes no roaming or calling/texting to or from
    Mexico and Canada, and no international texting. No Premium Extras: Cloud
    storage and Max (HBO Max) streaming are not included.

- id: 499
  name: "Cricket Wireless Select Unlimited Plan"
  category: "Phone Plans"
  description: >-
    >-2 (Phone not Included) The Cricket Wireless Select Unlimited™ Plan provides
