    4-Microphone Call Setup: Equipped with dual beamforming microphones on each
    earbud to isolate speech while using VoiceAware to adjust how much of your own
    voice you hear. Smart Ambient & TalkThru: Uses the microphone array to pass
    environmental safety audio through the driver, or drops music volume entirely to
    let you chat without removing the earbuds. IPX4 Weather Proofing: Certified
    splashproof and sweatproof to handle heavy gym workouts or rainy weather runs.

