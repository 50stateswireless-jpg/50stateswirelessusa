- id: 370
  name: "Garmin Forerunner® 165 Running Smartwatch ,  New , Sealed"
  category: "Smart Watches"
  description: >-
    >- The Garmin Forerunner 165 is a lightweight, user-friendly running smartwatch
    designed to support runners of all levels with advanced training tools and smart
    health insights. At its core is a bright, colorful AMOLED touchscreen display
    that makes stats easy to read at a glance, whether you’re checking pace mid-run
    or reviewing your daily progress. Its 43 mm size strikes a balance between a
    large, readable screen and comfortable all-day wear, while traditional button
    controls complement the touchscreen for reliable navigation during workouts.
    Built-in GPS enables accurate tracking of pace, distance, and route without
    needing to bring your phone, and the Forerunner 165 goes beyond basic metrics
    with comprehensive training features. Personalized daily suggested workouts
    adapt based on your performance and recovery status, helping you train smarter
    over time. The watch also offers adaptive plans for race training and a “morning
    report” that summarizes your sleep, recovery, and readiness for the day, giving
    you actionable insights to guide your training schedule. Health tracking on the
    Forerunner 165 is robust, with continuous wrist-based heart rate monitoring,
    pulse oximetry (blood oxygen), stress and sleep analysis, and Body Battery™
    energy monitoring to help you understand your body’s condition throughout the
    day and night. These features make it easy to see how your workouts, rest, and
    everyday activities affect your overall health and recovery. Despite all these
    capabilities, the Forerunner 165 maintains excellent battery life, lasting up to
    about 11 days in smartwatch mode and up to around 19 hours in GPS mode on a
    single charge, which keeps you going through long training cycles without
    frequent recharging. The watch also supports smart features like smartphone
    notifications and compatibility with the Garmin Connect™ app so you can sync
    data, customize metrics, and plan workouts easily. Product Overview Brand Name:
    Garmin Model Name: Forerunner 165

