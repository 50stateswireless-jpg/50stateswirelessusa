  name: "Apple iPhone 17 Pro Max MS Sturdy  Case , New , Sealed"
  category: "Smart Phones & Tablets Accessories"
  description: >-
    >+ Experience industrial-grade defense combined with seamless magnetic utility.
    Engineered specifically to fortify the large-format iPhone 17 Pro Max, this
